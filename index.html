<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>明日の服装予報（気象庁公式連携版）</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
            background-color: #000000;
            color: #f5f5f7;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .safe-area-top {
            padding-top: env(safe-area-inset-top, 16px);
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .text-wrap-optimal {
            word-break: auto-phrase;
            overflow-wrap: anywhere;
            line-break: strict;
        }

        .ios-btn:active {
            transform: scale(0.97);
            filter: brightness(0.85);
        }

        .ios-loader {
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ff9500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 最小フォントサイズ14px保証 */
        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body class="min-h-screen bg-black flex flex-col justify-between p-4 safe-area-top safe-area-bottom selection:bg-orange-500 selection:text-white text-[14px]">

    <div class="w-full max-w-sm mx-auto flex-1 flex flex-col justify-start space-y-4">
        
        <!-- iOS Style Header -->
        <header class="pt-2 pb-1 text-center relative">
            <button type="button" onclick="toggleSettingsModal(true)" class="absolute right-0 top-1 text-[#8e8e93] hover:text-white p-2 text-xl transition-colors" title="設定">
                ⚙️
            </button>
            <h1 class="text-[22px] font-bold tracking-tight text-white flex items-center justify-center gap-1.5">
                明日の服装予報
            </h1>
            <p id="headerSubtitle" class="text-[14px] text-[#8e8e93] mt-1 text-wrap-optimal font-normal">
                気象庁公式データ ＆ 体感温度連動
            </p>
        </header>

        <!-- Location Input Section -->
        <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-3.5 shadow-xl space-y-2.5">
            <div class="flex items-center justify-between px-1">
                <label for="locationInput" class="text-[14px] font-medium text-[#8e8e93] flex items-center gap-1.5">
                    <span>📍</span>
                    <span>登録場所の選択・管理</span>
                </label>
                <span id="saveStatus" class="text-[14px] text-[#30d158] font-medium transition-opacity opacity-0">追加完了</span>
            </div>
            
            <!-- 追加フォーム -->
            <div class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="locationInput" 
                    placeholder="市区町村・都道府県（例: 札幌、福岡）" 
                    class="flex-1 bg-[#2c2c2e]/70 border border-[#3a3a3c] focus:border-[#0a84ff] text-white text-[14px] rounded-xl px-3 py-2 outline-none transition-colors duration-150 placeholder-[#636366]"
                    onkeydown="if(event.key === 'Enter') handleAddLocation()"
                >
                <button 
                    type="button" 
                    onclick="handleAddLocation()" 
                    class="ios-btn bg-[#0a84ff] hover:bg-[#0071e3] active:scale-95 text-white font-semibold text-[14px] px-3.5 py-2 rounded-xl shrink-0 transition-all flex items-center gap-1">
                    <span>追加</span>
                </button>
            </div>

            <!-- 登録場所リスト -->
            <div class="pt-0.5">
                <div id="locationList" class="space-y-1.5 max-h-[235px] overflow-y-auto pr-0.5">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>
        </div>

        <!-- Day Selection & Action Section -->
        <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-3.5 shadow-2xl backdrop-blur-md space-y-3">
            <div>
                <label class="text-[14px] font-medium text-[#8e8e93] block mb-1.5 px-0.5">
                    📅 判定する対象日を選択
                </label>
                <div class="grid grid-cols-2 gap-1.5 bg-[#2c2c2e]/70 p-1 rounded-xl border border-[#3a3a3c]">
                    <button 
                        type="button" 
                        id="mainTabToday"
                        onclick="setTargetDay('today')" 
                        class="ios-btn py-1.5 text-[14px] font-semibold rounded-lg transition-all text-[#aeaeb2] hover:text-white">
                        今日
                    </button>
                    <button 
                        type="button" 
                        id="mainTabTomorrow"
                        onclick="setTargetDay('tomorrow')" 
                        class="ios-btn py-1.5 text-[14px] font-semibold rounded-lg transition-all bg-[#ff9500] text-white shadow-md">
                        明日
                    </button>
                </div>
            </div>

            <button 
                type="button"
                id="checkBtn" 
                onclick="getRecommendation()" 
                class="ios-btn w-full bg-gradient-to-r from-[#ff9500] to-[#ff5e3a] hover:brightness-110 text-white font-semibold text-[16px] h-12 rounded-xl shadow-lg transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer touch-manipulation">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                </svg>
                <span id="checkBtnLabel">明日の服装・天気を判定</span>
            </button>

            <!-- Loading State -->
            <div id="loading" class="hidden py-6 flex flex-col items-center justify-center">
                <div class="ios-loader w-8 h-8 mb-3"></div>
                <p id="loadingText" class="text-[14px] font-medium text-[#8e8e93] text-wrap-optimal animate-pulse text-center">
                    気象庁データ取得 ＆ 体感温度・服装判定中...
                </p>
            </div>
        </div>

        <!-- Fullscreen Result View -->
        <div id="resultBox" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col safe-area-top safe-area-bottom">
            <!-- Navigation Bar with Back Button & Overview Button -->
            <div class="flex items-center justify-between px-4 py-2.5 border-b border-[#2c2c2e] bg-[#1c1c1e]/80 backdrop-blur-md">
                <button type="button" onclick="closeResult()" class="ios-btn flex items-center gap-1 text-[#ff9500] font-semibold text-[16px] py-1 px-1 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>戻る</span>
                </button>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="toggleOverviewModal(true)" class="ios-btn bg-[#2c2c2e] hover:bg-[#3a3a3c] text-[#aeaeb2] hover:text-white text-[14px] px-2.5 py-1 rounded-lg border border-[#3a3a3c] flex items-center gap-1 transition-all">
                        <span>📜 概況</span>
                    </button>
                    <span id="resultLocationBadge" class="text-[14px] bg-[#2c2c2e] text-white border border-[#3a3a3c] px-3 py-1 rounded-full font-medium">東京都品川区</span>
                </div>
            </div>

            <!-- Scrollable Content Area -->
            <div id="resultScrollContainer" class="flex-1 overflow-y-auto px-3.5 py-2.5 space-y-2.5 max-w-sm w-full mx-auto">
                <!-- In-Result Day Switcher -->
                <div class="grid grid-cols-2 gap-1 bg-[#2c2c2e]/80 p-1 rounded-xl border border-[#3a3a3c]">
                    <button 
                        type="button" 
                        id="resTabToday"
                        onclick="switchResultDay('today')" 
                        class="ios-btn py-1 text-[14px] font-semibold rounded-lg transition-all text-[#aeaeb2]">
                        今日
                    </button>
                    <button 
                        type="button" 
                        id="resTabTomorrow"
                        onclick="switchResultDay('tomorrow')" 
                        class="ios-btn py-1 text-[14px] font-semibold rounded-lg transition-all bg-[#ff9500] text-white shadow">
                        明日
                    </button>
                </div>

                <!-- Weather Details Section -->
                <div class="bg-[#1c1c1e] rounded-2xl p-3 border border-[#2c2c2e] shadow-lg space-y-1.5">
                    <div class="flex items-center justify-between border-b border-[#2c2c2e] pb-1.5">
                        <div class="flex items-center gap-1.5">
                            <span id="resultWeatherEmoji" class="text-xl">🌤</span>
                            <span id="forecastHeaderTitle" class="text-[15px] font-bold text-white">予報</span>
                        </div>
                        <div>
                            <span id="forecastApparentBadge" class="text-[14px] bg-orange-500/20 text-orange-400 font-bold px-2 py-0.5 rounded-full border border-orange-500/30">体感 --℃</span>
                        </div>
                    </div>
                    <!-- 予報詳細テーブルコンテナ（フォントサイズを1ポイント大きくして視認性を向上） -->
                    <div id="forecastSection" class="text-[15px] font-medium text-[#d1d1d6] leading-snug space-y-1"></div>
                </div>

                <!-- Outfit Section -->
                <div class="bg-[#ff9500]/15 rounded-2xl p-3 border border-[#ff9500]/40 shadow-xl space-y-2">
                    <div class="flex items-center justify-between border-b border-[#ff9500]/30 pb-1.5">
                        <div class="flex items-center gap-1.5">
                            <span class="text-base">👔</span>
                            <h3 class="text-[15px] font-bold text-[#ff9500] uppercase tracking-wider">推奨服装</h3>
                        </div>
                        <span id="criteriaBadge" class="text-[14px] text-white/80 font-medium">--</span>
                    </div>
                    <div id="outfitSection" class="space-y-1.5"></div>
                    
                    <!-- 朝・昼・夜の気温＆服装タイムライン -->
                    <div class="bg-[#1c1c1e]/85 rounded-xl p-2.5 border border-[#3a3a3c] space-y-2 mt-2">
                        <div class="flex items-center justify-between text-[12pt] px-0.5">
                            <span class="font-bold text-[#ff9500] flex items-center gap-1">
                                <span>🕒</span>
                                <span>朝・昼・夜の寒暖差対策</span>
                            </span>
                        </div>
                        <div id="timeTimeline" class="grid grid-cols-3 gap-1.5 text-center text-[12pt]">
                            <!-- JavaScriptで動的生成 -->
                        </div>
                    </div>

                    <!-- Rain / Acc Advice -->
                    <div id="accessoryAdvice" class="mt-2 bg-[#1c1c1e]/60 rounded-xl p-2.5 border border-[#3a3a3c] text-[14px] text-[#aeaeb2]">
                        <!-- Dynamic accessory notice -->
                    </div>
                </div>

                <!-- Bottom Back Button -->
                <div class="pt-1 pb-4">
                    <button type="button" onclick="closeResult()" class="ios-btn w-full bg-[#2c2c2e] hover:bg-[#3a3a3c] text-white font-medium text-[15px] h-10 rounded-xl border border-[#3a3a3c] transition-all flex items-center justify-center">
                        閉じて戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- JMA Overview Popup Modal -->
        <div id="overviewModal" class="hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-3.5">
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-4 w-full max-w-sm shadow-2xl space-y-2.5 flex flex-col max-h-[80vh]">
                <div class="flex items-center justify-between border-b border-[#2c2c2e] pb-2">
                    <div class="flex items-center gap-1.5">
                        <span class="text-base">📜</span>
                        <h3 id="jmaOverviewTitle" class="text-[15px] font-bold text-white">気象庁 天気概況</h3>
                    </div>
                    <span id="jmaReportTimeBadge" class="text-[14px] text-[#8e8e93] font-mono">--:-- 発表</span>
                </div>
                <div id="jmaOverviewText" class="text-[14px] text-[#d1d1d6] leading-relaxed whitespace-pre-wrap overflow-y-auto pr-1 py-1 max-h-[50vh]">
                    気象概況を取得中...
                </div>
                <div class="pt-1">
                    <button type="button" onclick="toggleOverviewModal(false)" class="ios-btn w-full bg-[#2c2c2e] hover:bg-[#3a3a3c] text-white font-medium text-[14px] py-2 rounded-xl border border-[#3a3a3c]">
                        閉じる
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal (Optional Gemini API Key) -->
        <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-[17px] font-bold text-white">⚙️ API詳細設定（任意）</h3>
                    <button type="button" onclick="toggleSettingsModal(false)" class="text-[#8e8e93] hover:text-white text-lg">✕</button>
                </div>
                <p class="text-[14px] text-[#8e8e93] leading-relaxed">
                    標準状態で登録不要の気象庁公式APIおよびOpen-Meteoを使用しているため、設定なしでもそのままご利用いただけます。
                </p>
                <div>
                    <label for="userApiKey" class="text-[14px] text-[#8e8e93] mb-1 block">Gemini APIキー（設定すると高度な助言を追加可能）</label>
                    <input 
                        type="password" 
                        id="userApiKey" 
                        placeholder="AI Studioのキー（空欄でOK）"
                        class="w-full bg-[#2c2c2e] border border-[#3a3a3c] text-white text-[14px] rounded-xl px-3 py-2 outline-none focus:border-[#0a84ff]"
                    >
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="saveApiKeySettings()" class="flex-1 bg-[#0a84ff] hover:bg-[#0071e3] text-white py-2 rounded-xl text-[14px] font-semibold transition-colors">保存する</button>
                    <button type="button" onclick="toggleSettingsModal(false)" class="bg-[#2c2c2e] hover:bg-[#3a3a3c] text-[#aeaeb2] px-4 py-2 rounded-xl text-[14px] transition-colors">キャンセル</button>
                </div>
            </div>
        </div>

        <!-- Error Card -->
        <div id="errorBox" class="hidden bg-[#2c1517] border border-[#ff453a]/30 rounded-2xl p-4 text-[14px] text-[#ff453a] leading-relaxed text-wrap-optimal"></div>

    </div>

    <!-- Minimal Footer -->
    <footer class="text-center py-2">
        <p class="text-[14px] text-[#636366]">気象庁公式データ ＆ Open-Meteo連携</p>
    </footer>

        // 指定された手持ち服リスト＆体感温度による厳格な判定基準（変更完全禁止）
        function evaluateClothingByCriteria(apparentTemp) {
            let label = '';
            let jacket = '';
            let pants = '';

            if (apparentTemp >= 25) {
                label = '25℃以上 (夏日・暖気)';
                jacket = '半袖シャツ';
                pants = 'ズボン';
            } else if (apparentTemp >= 20) {
                label = '20℃〜24℃ (過ごしやすい)';
                jacket = '長袖シャツ';
                pants = 'ズボン';
            } else if (apparentTemp >= 16) {
                label = '16℃〜19℃ (肌寒い・要羽織り)';
                jacket = 'インナーシャツ ＋ 長袖シャツ ＋ ジャケット';
                pants = 'ズボン';
            } else if (apparentTemp >= 11) {

        window.addEventListener('DOMContentLoaded', () => {
            loadLocations();
            renderLocations();
            updateTabStyles();
            const savedApiKey = localStorage.getItem(STORAGE_KEY_API_KEY);

        function loadLocations() {
            const savedListJson = localStorage.getItem(STORAGE_KEY_LIST);
            if (savedListJson) {
                try {
                    locations = JSON.parse(savedListJson);
                } catch (e) {
                    locations = [...DEFAULT_LOCATIONS];
                }
            } else {
                locations = [...DEFAULT_LOCATIONS];
                saveLocationsToStorage();
            }

            if (!Array.isArray(locations) || locations.length === 0) {
                locations = ['東京都品川区'];
            }

            const savedActive = localStorage.getItem(STORAGE_KEY_ACTIVE);
            if (savedActive && locations.includes(savedActive)) {
                activeLocation = savedActive;
            } else {
                activeLocation = locations[0];
                localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
            }
        }

        function saveLocationsToStorage() {
            localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(locations));
            localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
        }

        function renderLocations() {
            const listEl = document.getElementById('locationList');
            if (!listEl) return;

            listEl.innerHTML = '';
            locations.forEach((loc) => {
                const isActive = (loc === activeLocation);
                
                const item = document.createElement('div');
                item.className = `flex items-center justify-between px-3 py-2 rounded-xl border transition-all ${
                    isActive 
                        ? 'bg-[#ff9500]/20 border-[#ff9500]/70 text-white shadow-sm' 
                        : 'bg-[#2c2c2e]/60 border-[#3a3a3c] text-[#aeaeb2] hover:bg-[#2c2c2e]'
                }`;

                const textBtn = document.createElement('button');
                textBtn.type = 'button';
                textBtn.className = 'flex-1 text-left flex items-center gap-2 text-[14px] font-medium outline-none truncate';
                textBtn.innerHTML = `
                    <span class="${isActive ? 'text-[#ff9500]' : 'text-transparent'} text-[14px] select-none font-bold">✓</span>
                    <span class="truncate ${isActive ? 'font-semibold text-white' : ''}">${escapeHtml(loc)}</span>
                `;
                textBtn.onclick = () => selectLocation(loc);

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'ios-btn text-[#8e8e93] hover:text-[#ff453a] active:text-[#ff453a] p-1.5 ml-2 rounded-lg text-[14px] transition-colors';
                delBtn.setAttribute('aria-label', `${loc}を削除`);
                delBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                `;
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    handleDeleteLocation(loc);
                };

                item.appendChild(textBtn);
                item.appendChild(delBtn);
                listEl.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function selectLocation(loc) {
            activeLocation = loc;
            saveLocationsToStorage();
            renderLocations();
        }

        function handleAddLocation() {
            const input = document.getElementById('locationInput');
            const status = document.getElementById('saveStatus');
            const val = input?.value.trim();

            if (!val) return;

            if (!locations.includes(val)) {
                locations.unshift(val);
                activeLocation = val;
                saveLocationsToStorage();
                renderLocations();

                if (status) {
                    status.innerText = '追加完了';
                    status.classList.remove('opacity-0');
                    setTimeout(() => status.classList.add('opacity-0'), 1800);
                }
            } else {
                selectLocation(val);
            }

            if (input) input.value = '';
        }

        function handleDeleteLocation(locToDelete) {
            if (locations.length <= 1) {
                const status = document.getElementById('saveStatus');
                if (status) {
                    status.innerText = '最後の1件は削除不可';
                    status.classList.remove('opacity-0');
                    setTimeout(() => status.classList.add('opacity-0'), 2000);
                }
                return;
            }

            locations = locations.filter(item => item !== locToDelete);
            if (activeLocation === locToDelete) {
                activeLocation = locations[0];
            }

            saveLocationsToStorage();
            renderLocations();
        }

        function toggleSettingsModal(show) {

        function resolveAreaAndCoords(locationName) {
            for (const [key, data] of Object.entries(PREFECTURE_MAP)) {
                if (locationName.includes(key)) {
                    return data;
                }
            }
            // デフォルト: 東京
            return { code: '130000', lat: 35.6895, lon: 139.6917 };
        }

        function getTomorrowDateString() {
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
            const y = tomorrow.getFullYear();
            const m = String(tomorrow.getMonth() + 1).padStart(2, '0');
            const d = String(tomorrow.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getTodayDateString() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        async function getRecommendation() {
            const btn = document.getElementById('checkBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const errorBox = document.getElementById('errorBox');
            const resultBadge = document.getElementById('resultLocationBadge');
            const jmaOverviewTitle = document.getElementById('jmaOverviewTitle');
            const jmaReportTimeBadge = document.getElementById('jmaReportTimeBadge');
            const jmaOverviewText = document.getElementById('jmaOverviewText');
            const resultScroll = document.getElementById('resultScrollContainer');

            const targetLocation = activeLocation || '東京都品川区';

            if (resultBadge) resultBadge.innerText = targetLocation;

            btn.disabled = true;
            btn.classList.add('opacity-50', 'pointer-events-none');
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                const areaInfo = resolveAreaAndCoords(targetLocation);
                const areaCode = areaInfo.code;
                const coords = { lat: areaInfo.lat, lon: areaInfo.lon };

                const todayStr = getTodayDateString();
                const tomorrowStr = getTomorrowDateString();

                const jmaForecastUrl = `https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`;
                const jmaOverviewUrl = `https://www.jma.go.jp/bosai/forecast/data/overview_forecast/${areaCode}.json`;
                const meteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=apparent_temperature_max,apparent_temperature_min,temperature_2m_max,temperature_2m_min,windspeed_10m_max,precipitation_probability_max&hourly=temperature_2m,apparent_temperature&timezone=Asia%2FTokyo&forecast_days=4`;

                const [jmaForecastRes, jmaOverviewRes, meteoRes] = await Promise.all([
                    fetch(jmaForecastUrl).catch(() => null),
                    fetch(jmaOverviewUrl).catch(() => null),
                    fetch(meteoUrl).catch(() => null)
                ]);

                let overviewReportTime = '';
                let overviewTarget = '';
                let overviewBody = '気象庁の概況文を更新中、または取得できませんでした。';

                if (jmaOverviewRes && jmaOverviewRes.ok) {
                    const overviewData = await jmaOverviewRes.json();
                    if (overviewData) {
                        overviewTarget = overviewData.targetArea || '';
                        if (overviewData.reportDatetime) {
                            const d = new Date(overviewData.reportDatetime);
                            overviewReportTime = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 発表`;
                        }
                        if (overviewData.text) {
                            overviewBody = overviewData.text.trim();
                        }
                    }
                }

                if (jmaOverviewTitle) jmaOverviewTitle.innerText = `天気概況（${overviewTarget || targetLocation}）`;
                if (jmaReportTimeBadge) jmaReportTimeBadge.innerText = overviewReportTime || '公式発表';
                if (jmaOverviewText) jmaOverviewText.innerText = overviewBody;

                let jmaData = null;
                if (jmaForecastRes && jmaForecastRes.ok) {
                    jmaData = await jmaForecastRes.json();
                }

                let meteoData = null;
                if (meteoRes && meteoRes.ok) {
                    meteoData = await meteoRes.json();
                }

                // 今日と明日の予報オブジェクトを作成
                const parseDayData = (dateStr, fallbackIdx, labelPrefix) => {
                    let weatherText = '曇り時々晴れ';
                    let windText = '北寄りの風';
                    let maxTemp = null;
                    let minTemp = null;
                    let popList = [];
                    let targetDateLabel = labelPrefix;
                    let apparentTemp = null;
                    let maxWindSpeed = 3.0;
                    let morningTemp = null;
                    let noonTemp = null;
                    let nightTemp = null;

                    if (Array.isArray(jmaData) && jmaData.length > 0) {
                        const weatherSeries = jmaData[0]?.timeSeries?.[0];
                        const area = weatherSeries?.areas?.[0];
                        const timeDefines = weatherSeries?.timeDefines || [];

                        let targetIdx = timeDefines.findIndex(t => t.startsWith(dateStr));
                        if (targetIdx === -1) {
                            targetIdx = Math.min(fallbackIdx, timeDefines.length - 1);
                        }

                        if (timeDefines[targetIdx]) {
                            const d = new Date(timeDefines[targetIdx]);
                            const days = ['日', '月', '火', '水', '木', '金', '土'];
                            targetDateLabel = `${labelPrefix}【${d.getDate()}日(${days[d.getDay()]})】`;
                        }

                        if (area?.weathers?.[targetIdx]) {
                            weatherText = area.weathers[targetIdx].replace(/\s+/g, ' ').trim();
                        }
                        if (area?.winds?.[targetIdx]) {
                            windText = area.winds[targetIdx].replace(/\s+/g, ' ').trim();
                        }

                        // 降水確率
                        const popSeries = jmaData[0]?.timeSeries?.[1];
                        const popArea = popSeries?.areas?.[0];
                        const popDefines = popSeries?.timeDefines || [];

                        if (popArea?.pops) {
                            popDefines.forEach((t, idx) => {
                                if (t.startsWith(dateStr) && popArea.pops[idx] !== undefined) {
                                    popList.push(`${popArea.pops[idx]}%`);
                                }
                            });
                        }

                        // 気温
                        const tempSeries = jmaData[0]?.timeSeries?.[2];
                        const tempArea = tempSeries?.areas?.[0];
                        const tempDefines = tempSeries?.timeDefines || [];
                        const tempVals = tempArea?.temps || [];

                        tempDefines.forEach((t, idx) => {
                            if (t.startsWith(dateStr) && tempVals[idx] !== undefined) {
                                const val = parseInt(tempVals[idx], 10);
                                if (minTemp === null || val < minTemp) minTemp = val;
                                if (maxTemp === null || val > maxTemp) maxTemp = val;
                            }
                        });

                        // 週間予報テーブル補完
                        if ((minTemp === null || maxTemp === null) && jmaData[1]?.timeSeries?.[1]) {
                            const weekArea = jmaData[1].timeSeries[1].areas?.[0];
                            const weekDefines = jmaData[1].timeSeries[1].timeDefines || [];
                            const weekIdx = weekDefines.findIndex(t => t.startsWith(dateStr));
                            if (weekIdx !== -1 && weekArea) {
                                if (weekArea.tempsMin?.[weekIdx]) minTemp = parseInt(weekArea.tempsMin[weekIdx], 10);
                                if (weekArea.tempsMax?.[weekIdx]) maxTemp = parseInt(weekArea.tempsMax[weekIdx], 10);
                            }
                        }
                    }

                    // Open-Meteo補完
                    const daily = meteoData?.daily;
                    if (daily && Array.isArray(daily.time)) {
                        let mIdx = daily.time.indexOf(dateStr);
                        if (mIdx === -1) mIdx = fallbackIdx;

                        if (daily.apparent_temperature_max?.[mIdx] !== undefined) {
                            apparentTemp = Math.round(daily.apparent_temperature_max[mIdx]);
                        }
                        if (minTemp === null && daily.temperature_2m_min?.[mIdx] !== undefined) {
                            minTemp = Math.round(daily.temperature_2m_min[mIdx]);
                        }
                        if (maxTemp === null && daily.temperature_2m_max?.[mIdx] !== undefined) {
                            maxTemp = Math.round(daily.temperature_2m_max[mIdx]);
                        }
                        if (daily.windspeed_10m_max?.[mIdx] !== undefined) {
                            maxWindSpeed = parseFloat((daily.windspeed_10m_max[mIdx] / 3.6).toFixed(1));
                        }
                    }

                    // Open-Meteo Hourly（朝8時、昼14時、夜20時）の気温を抽出
                    const hourly = meteoData?.hourly;
                    if (hourly && Array.isArray(hourly.time)) {
                        const mMorningIdx = hourly.time.indexOf(`${dateStr}T08:00`);
                        const mNoonIdx = hourly.time.indexOf(`${dateStr}T14:00`);
                        const mNightIdx = hourly.time.indexOf(`${dateStr}T20:00`);

                        if (mMorningIdx !== -1 && hourly.temperature_2m?.[mMorningIdx] !== undefined) {
                            morningTemp = Math.round(hourly.temperature_2m[mMorningIdx]);
                        }
                        if (mNoonIdx !== -1 && hourly.temperature_2m?.[mNoonIdx] !== undefined) {
                            noonTemp = Math.round(hourly.temperature_2m[mNoonIdx]);
                        }
                        if (mNightIdx !== -1 && hourly.temperature_2m?.[mNightIdx] !== undefined) {
                            nightTemp = Math.round(hourly.temperature_2m[mNightIdx]);
                        }
                    }

                    if (maxTemp === null) maxTemp = 20;
                    if (minTemp === null) minTemp = 14;
                    if (apparentTemp === null) {
                        apparentTemp = Math.round(maxTemp - (maxWindSpeed * 0.7));
                    }
                    if (morningTemp === null) morningTemp = minTemp + 2;
                    if (noonTemp === null) noonTemp = maxTemp;
                    if (nightTemp === null) nightTemp = minTemp + 3;

                    return {
                        weatherText,
                        windText,
                        maxTemp,
                        minTemp,
                        popList,
                        targetDateLabel,
                        apparentTemp,
                        maxWindSpeed,
                        morningTemp,
                        noonTemp,
                        nightTemp
                    };
                };

                // 今日・明日のデータを生成してキャッシュ
                cachedForecastData = {
                    today: parseDayData(todayStr, 0, '今日'),
                    tomorrow: parseDayData(tomorrowStr, 1, '明日')
                };

                // 選択されている日の予報を描画
                updateTabStyles();
                renderForecastView(cachedForecastData[selectedDay]);
                if (resultScroll) resultScroll.scrollTop = 0;
                resultBox.classList.remove('hidden');

            } catch (err) {
                console.error("Forecast Error:", err);
                errorBox.innerText = `データ取得中にエラーが発生しました: ${err.message}`;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'pointer-events-none');
                loading.classList.add('hidden');
            }
        }

                        <div class="text-[#aeaeb2] text-[13px] whitespace-nowrap tracking-tight text-center w-full">${morningTemp <= 15 ? '羽織り推奨' : '快適'}</div>
                    </div>
                    <div class="bg-[#2c2c2e]/70 rounded-xl px-1 py-2 border border-[#3a3a3c] flex flex-col items-center justify-between min-h-[96px] overflow-hidden">
                        <div class="text-[#8e8e93] text-[12pt] font-medium whitespace-nowrap">昼 (14時)</div>
                        <div class="font-bold text-orange-400 font-mono text-[13pt] my-1">${noonTemp}℃</div>
                        <div class="text-[#aeaeb2] text-[13px] whitespace-nowrap tracking-tight text-center w-full">${noonTemp >= 22 ? '上着不要' : '適温'}</div>
                    </div>
                    <div class="bg-[#2c2c2e]/70 rounded-xl px-1 py-2 border border-[#3a3a3c] flex flex-col items-center justify-between min-h-[96px] overflow-hidden">
                        <div class="text-[#8e8e93] text-[12pt] font-medium whitespace-nowrap">夜 (20時)</div>
                        <div class="font-bold text-[#64d2ff] font-mono text-[13pt] my-1">${nightTemp}℃</div>
                        <div class="text-[#aeaeb2] text-[13px] whitespace-nowrap tracking-tight text-center w-full">${nightTemp <= 14 ? '冷え込み注意' : '過ごしやすい'}</div>
                    </div>
                `;
            }

            if (accessoryAdvice) {
                let advice = [];
                const hasRain = weatherText.includes('雨') || popList.some(p => parseInt(p, 10) >= 30);
                if (hasRain) {
                    advice.push('☔ 雨の可能性があるため、折りたたみ傘やレインコートのご用意をおすすめします。');
                }
                if (maxTemp - minTemp >= 8) {
                    advice.push('🧣 朝晩と日中の寒暖差が大きいため、脱ぎ着しやすい羽織りものが便利です。');
                }
                if (maxWindSpeed >= 6) {
                    advice.push('💨 風がやや強めに吹く予報です。風を通しにくいアウターが適しています。');
                }

                if (advice.length === 0) {
                    advice.push('✨ 気温・風ともに穏やかな過ごしやすい予報です。いつもの快適な装いでお出かけください。');
                }

                accessoryAdvice.innerHTML = advice.join('<br>');
            }
        }
    </script>
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
